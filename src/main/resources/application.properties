spring.application.name=procureflow

# Datasource configuration with environment variable support for cloud deployment (Render/Supabase/Neon)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/procureflow}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:ProcureFlow@123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Server Port (Render automatically injects PORT env variable)
server.port=${PORT:8081}
